<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Table</h1>
    <table border="5">
        <tr>
            <th>Sno</th>
            <th>item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>1. </td>
            <td>Apple </td>
            <td>1.99$</td>
        </tr>
    </table>
    <table border="5">
        <tr>
            <th rowspan="2">Sno</th>
            <th>item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>1. </td>
            <td>Apple </td>
            <td>1.99$</td>
        </tr>
    </table>
    <table border="5">
        <tr>
            <th colspan="2">Sno</th>
            <th>item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>1. </td>
            <td>Apple </td>
            <td>1.99$</td>
        </tr>
    </table>
</body>
</html>
